name: 버그 리포트
description: 버그나 오류를 신고합니다
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해 주셔서 감사합니다. 아래 항목을 가능한 한 자세히 작성해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해 주세요.
      placeholder: 예) 확인 버튼을 눌러도 힌트가 표시되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 만들 수 있는 단계를 적어 주세요.
      placeholder: |
        1. python -m streamlit run app.py 실행
        2. 숫자 50 입력
        3. 확인 버튼 클릭
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작했을 때 어떻게 되어야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 일이 발생했는지 적어 주세요.
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 버전
      placeholder: "3.11.9 (64-bit)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: "Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 터미널 오류 메시지나 스크린샷이 있다면 첨부해 주세요.
