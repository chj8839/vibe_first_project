name: 기능 요청
description: 새로운 기능이나 개선 사항을 제안합니다
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        기능 제안을 환영합니다. 아래 항목을 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제 / 동기
      description: 어떤 문제를 해결하고 싶은지, 또는 왜 이 기능이 필요한지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 기능이나 개선 방향을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려해 본 다른 방법이 있다면 적어 주세요.

  - type: dropdown
    id: priority
    attributes:
      label: 중요도
      options:
        - 낮음
        - 보통
        - 높음
    validations:
      required: true
